<script>
// ============================================================
// 1. Coding Train Style Tile Input
// ============================================================

const codingTrainTiles = [
  {
    name: "blank",
    edges: ["AAA", "AAA", "AAA", "AAA"]
  },
  {
    name: "up",
    edges: ["ABA", "AAA", "AAA", "AAA"]
  },
  {
    name: "right",
    edges: ["AAA", "ABA", "AAA", "AAA"]
  },
  {
    name: "down",
    edges: ["AAA", "AAA", "ABA", "AAA"]
  }
];

function codingTrainTilesToSpec(codingTrainTiles, width, height) {
  return {
    width,
    height,
    tiles: codingTrainTiles.map(tile => ({
      name: tile.name,
      north: tile.edges[0],
      east: tile.edges[1],
      south: tile.edges[2],
      west: tile.edges[3]
    }))
  };
}

const spec = codingTrainTilesToSpec(codingTrainTiles, 5, 5);

function buildAllowed(spec) {
  const allowed = {
    right: {},
    down: {}
  };

  for (const t1 of spec.tiles) {
    allowed.right[t1.name] = [];
    allowed.down[t1.name] = [];

    for (const t2 of spec.tiles) {
      if (t1.east === t2.west) {
        allowed.right[t1.name].push(t2.name);
      }

      if (t1.south === t2.north) {
        allowed.down[t1.name].push(t2.name);
      }
    }
  }

  return allowed;
}

spec.allowed = buildAllowed(spec);

const N = spec.width;
const tileObjects = spec.tiles;
const tiles = tileObjects.map(t => t.name);

// ============================================================
// 2. Shared Helpers
// ============================================================

function printGrid(grid) {
  return grid.map(row => row.join(" ")).join("\n");
}

// ============================================================
// 2A. Overlapping WFC: Text Grid Pattern Extraction
// ============================================================

const sampleTextGrid = [
  "ABABA",
  "BABAB",
  "ABABA",
  "BABAB",
  "ABABA"
];


function patternKey(pattern) {
  const rows = pattern.rows || pattern;
  return rows.map(row => Array.isArray(row) ? row.join("") : String(row)).join("/");
}

function countPatternFrequencies(patterns) {
  const counts = new Map();

  for (const p of patterns) {
    const key = patternKey(p);
    counts.set(key, (counts.get(key) || 0) + 1);
  }

  return counts;
}

function weightedRandomChoice(items, weightFn) {
  const total = items.reduce((sum, item) => sum + weightFn(item), 0);
  let r = Math.random() * total;

  for (const item of items) {
    r -= weightFn(item);
    if (r <= 0) return item;
  }

  return items[items.length - 1];
}


function extractOverlappingPatterns(textGrid, patternSize) {
  const height = textGrid.length;
  const width = textGrid[0].length;

  const patternMap = new Map();

  for (let y = 0; y <= height - patternSize; y++) {
    for (let x = 0; x <= width - patternSize; x++) {
      const rows = [];

      for (let dy = 0; dy < patternSize; dy++) {
        rows.push(textGrid[y + dy].slice(x, x + patternSize));
      }

      const key = rows.join("/");

      if (!patternMap.has(key)) {
        patternMap.set(key, {
          id: patternMap.size,
          rows,
          frequency: 0
        });
      }

      patternMap.get(key).frequency++;
    }
  }

  return Array.from(patternMap.values());
}

function printPatterns(patterns) {
  return patterns.map(pattern =>
    `Pattern ${pattern.id}  frequency=${pattern.frequency}\n` +
    pattern.rows.join("\n")
  ).join("\n\n");
}

const overlappingPatterns = extractOverlappingPatterns(sampleTextGrid, 2);
const overlapPatternFrequencies = countPatternFrequencies(overlappingPatterns);
const overlapPatternWeightsById = new Map(
  overlappingPatterns.map(pattern => [
    pattern.id,
    pattern.frequency || overlapPatternFrequencies.get(patternKey(pattern)) || 1
  ])
);
console.log("Overlapping pattern frequencies:", overlapPatternFrequencies);

function patternsOverlapRight(leftPattern, rightPattern) {
  const size = leftPattern.rows.length;

  for (let y = 0; y < size; y++) {
    if (leftPattern.rows[y].slice(1) !== rightPattern.rows[y].slice(0, size - 1)) {
      return false;
    }
  }

  return true;
}

function patternsOverlapDown(topPattern, bottomPattern) {
  const size = topPattern.rows.length;

  for (let y = 1; y < size; y++) {
    if (topPattern.rows[y] !== bottomPattern.rows[y - 1]) {
      return false;
    }
  }

  return true;
}

function buildOverlapCompatibility(patterns) {
  const allowed = {
    right: {},
    down: {}
  };

  for (const p1 of patterns) {
    allowed.right[p1.id] = [];
    allowed.down[p1.id] = [];

    for (const p2 of patterns) {
      if (patternsOverlapRight(p1, p2)) {
        allowed.right[p1.id].push(p2.id);
      }

      if (patternsOverlapDown(p1, p2)) {
        allowed.down[p1.id].push(p2.id);
      }
    }
  }

  return allowed;
}

function printOverlapCompatibility(allowed) {
  const lines = [];

  lines.push("Right compatibility:");
  for (const [patternId, allowedIds] of Object.entries(allowed.right)) {
    lines.push(`Pattern ${patternId} -> ${allowedIds.join(", ")}`);
  }

  lines.push("");
  lines.push("Down compatibility:");
  for (const [patternId, allowedIds] of Object.entries(allowed.down)) {
    lines.push(`Pattern ${patternId} -> ${allowedIds.join(", ")}`);
  }

  return lines.join("\n");
}

const overlapAllowed = buildOverlapCompatibility(overlappingPatterns);

function overlappingPatternsToCnf(patterns, allowed, width, height) {
  let nextVar = 1;
  const varMap = {};
  const nameMap = {};
  const clauses = [];

  function varFor(x, y, patternId) {
    const key = `${x},${y},P${patternId}`;

    if (!varMap[key]) {
      varMap[key] = nextVar;
      nameMap[nextVar] = key;
      nextVar++;
    }

    return varMap[key];
  }

  // Create variables: pattern p is placed at output cell (x,y)
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      for (const pattern of patterns) {
        varFor(x, y, pattern.id);
      }
    }
  }

  // Exactly one pattern per output cell
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      clauses.push(patterns.map(pattern => varFor(x, y, pattern.id)));

      for (let i = 0; i < patterns.length; i++) {
        for (let j = i + 1; j < patterns.length; j++) {
          clauses.push([
            -varFor(x, y, patterns[i].id),
            -varFor(x, y, patterns[j].id)
          ]);
        }
      }
    }
  }

  function addOverlapClauses(direction, dx, dy) {
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const nx = x + dx;
        const ny = y + dy;

        if (nx < 0 || nx >= width || ny < 0 || ny >= height) continue;

        for (const p1 of patterns) {
          for (const p2 of patterns) {
            const ok = allowed[direction][p1.id].includes(p2.id);

            if (!ok) {
              clauses.push([
                -varFor(x, y, p1.id),
                -varFor(nx, ny, p2.id)
              ]);
            }
          }
        }
      }
    }
  }

  addOverlapClauses("right", 1, 0);
  addOverlapClauses("down", 0, 1);

  const numVars = nextVar - 1;

  const dimacs =
    `p cnf ${numVars} ${clauses.length}\n` +
    clauses.map(c => c.join(" ") + " 0").join("\n");

  return {
    clauses,
    varMap,
    nameMap,
    dimacs,
    numVars
  };
}

const overlapCnf = overlappingPatternsToCnf(
  overlappingPatterns,
  overlapAllowed,
  4,
  4
);

function solveOverlapBacktracking(patterns, allowed, width, height) {
  const grid = Array.from({ length: height }, () => Array(width).fill(null));

  function canPlace(x, y, patternId) {
    if (x > 0 && grid[y][x - 1] !== null) {
      if (!allowed.right[grid[y][x - 1]].includes(patternId)) return false;
    }

    if (y > 0 && grid[y - 1][x] !== null) {
      if (!allowed.down[grid[y - 1][x]].includes(patternId)) return false;
    }

    return true;
  }

  function search(x = 0, y = 0) {
    if (y === height) return true;

    const nextX = (x + 1) % width;
    const nextY = y + (x + 1 === width ? 1 : 0);

    for (const pattern of patterns) {
      if (canPlace(x, y, pattern.id)) {
        grid[y][x] = pattern.id;

        if (search(nextX, nextY)) return true;

        grid[y][x] = null;
      }
    }

    return false;
  }

  if (!search()) {
    throw new Error("No overlapping-pattern solution found.");
  }

  return grid;
}

function runOverlapScalingExperiment(sizes) {
  console.log("=== Overlap scaling experiment ===");
  console.log("size, vars, clauses, encodeMs, backtrackingMs, success");

  for (const size of sizes) {
    let cnf = null;
    let encodeMs = null;
    let backtrackingMs = null;
    let success = true;

    try {
      const encodeStart = performance.now();
      cnf = overlappingPatternsToCnf(
        overlappingPatterns,
        overlapAllowed,
        size,
        size
      );
      encodeMs = performance.now() - encodeStart;

      const backtrackingStart = performance.now();
      solveOverlapBacktracking(
        overlappingPatterns,
        overlapAllowed,
        size,
        size
      );
      backtrackingMs = performance.now() - backtrackingStart;
    } catch (err) {
      success = false;
      console.warn("Overlap scaling failed at size", size, err);
    }

    console.log({
      size: `${size}x${size}`,
      vars: cnf ? cnf.numVars : null,
      clauses: cnf ? cnf.clauses.length : null,
      encodeMs: encodeMs === null ? null : Number(encodeMs.toFixed(3)),
      backtrackingMs: backtrackingMs === null ? null : Number(backtrackingMs.toFixed(3)),
      success
    });
  }
}

runOverlapScalingExperiment([4, 8, 12, 16, 20]);

function gridToOverlapSatAssignment(patternGrid, cnf, patterns) {
  const assignment = {};

  for (let y = 0; y < patternGrid.length; y++) {
    for (let x = 0; x < patternGrid[y].length; x++) {
      for (const pattern of patterns) {
        const key = `${x},${y},P${pattern.id}`;
        const v = cnf.varMap[key];

        assignment[v] = patternGrid[y][x] === pattern.id;
      }
    }
  }

  return assignment;
}

function decodeOverlapSatAssignment(assignment, cnf, width, height) {
  const grid = Array.from({ length: height }, () => Array(width).fill(null));

  for (const [varId, isTrue] of Object.entries(assignment)) {
    if (!isTrue) continue;

    const name = cnf.nameMap[varId];
    if (!name) continue;

    const [xStr, yStr, patternName] = name.split(",");
    const x = Number(xStr);
    const y = Number(yStr);
    const patternId = Number(patternName.slice(1));

    grid[y][x] = patternId;
  }

  return grid;
}

function reconstructTextGridFromPatternGrid(patternGrid, patterns) {
  const patternById = new Map(patterns.map(pattern => [pattern.id, pattern]));
  const patternSize = patterns[0].rows.length;
  const outputHeight = patternGrid.length + patternSize - 1;
  const outputWidth = patternGrid[0].length + patternSize - 1;

  const output = Array.from({ length: outputHeight }, () =>
    Array(outputWidth).fill("?")
  );

  for (let y = 0; y < patternGrid.length; y++) {
    for (let x = 0; x < patternGrid[y].length; x++) {
      const pattern = patternById.get(patternGrid[y][x]);

      for (let dy = 0; dy < patternSize; dy++) {
        for (let dx = 0; dx < patternSize; dx++) {
          output[y + dy][x + dx] = pattern.rows[dy][dx];
        }
      }
    }
  }

  return output.map(row => row.join(""));
}

function renderTextGrid(textGrid, elementId) {
  const container = document.getElementById(elementId);
  container.className = "text-grid";
  container.style.gridTemplateColumns = `repeat(${textGrid[0].length}, 40px)`;
  container.innerHTML = "";

  for (const row of textGrid) {
    for (const ch of row) {
      const cell = document.createElement("div");
      cell.className = "text-cell";
      cell.textContent = ch;
      container.appendChild(cell);
    }
  }
}

const solvedOverlapPatternGrid = solveOverlapBacktracking(
  overlappingPatterns,
  overlapAllowed,
  4,
  4
);

const fakeOverlapSatAssignment = gridToOverlapSatAssignment(
  solvedOverlapPatternGrid,
  overlapCnf,
  overlappingPatterns
);

const decodedOverlapPatternGrid = decodeOverlapSatAssignment(
  fakeOverlapSatAssignment,
  overlapCnf,
  4,
  4
);

const reconstructedOverlapTextGrid = reconstructTextGridFromPatternGrid(
  decodedOverlapPatternGrid,
  overlappingPatterns
);

console.log("Sample text grid:");
console.log(sampleTextGrid.join("\n"));

console.log("Overlapping patterns:");
console.log(printPatterns(overlappingPatterns));

console.log("Overlap compatibility:");
console.log(printOverlapCompatibility(overlapAllowed));

console.log("Overlapping pattern CNF:");
console.log(`Variables: ${overlapCnf.numVars}`);
console.log(`Clauses: ${overlapCnf.clauses.length}`);
console.log(overlapCnf.dimacs);


function renderGrid(grid, elementId) {
  const container = document.getElementById(elementId);

  container.className = "grid";
  container.innerHTML = "";

  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      const tile = grid[y][x];
      const cell = document.createElement("div");

      cell.className = `cell tile-${tile}`;

      container.appendChild(cell);
    }
  }
}


function makeEmptyGrid(width, height) {
  return Array.from({ length: height }, () => Array(width).fill(null));
}

function tileName(tile) {
  return typeof tile === "string" ? tile : tile.name;
}

function allowedNeighbor(direction, t1, t2) {
  const name1 = tileName(t1);
  const name2 = tileName(t2);

  const allowedList = spec.allowed[direction][name1];

  if (!allowedList) {
    console.warn("No allowed list for:", direction, name1, spec.allowed);
    return false;
  }

  return allowedList.includes(name2);
}

function isValid(grid, x, y, tile) {
  if (x > 0 && grid[y][x - 1] !== null) {
    if (!allowedNeighbor("right", grid[y][x - 1], tile)) return false;
  }

  if (y > 0 && grid[y - 1][x] !== null) {
    if (!allowedNeighbor("down", grid[y - 1][x], tile)) return false;
  }

  return true;
}

// ============================================================
// 3. Greedy Generator
// ============================================================

function greedy() {
  let grid = makeEmptyGrid(N, N);

  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      let choice = Math.random() < 0.5 ? "A" : "B";

      if (!isValid(grid, x, y, choice)) {
        choice = "B";
      }

      grid[y][x] = choice;
    }
  }

  return grid;
}

// ============================================================
// 4. SAT-Style Backtracking Solver
// ============================================================

function solveBacktracking(grid, x = 0, y = 0) {
  if (y === N) return true;

  let nextX = (x + 1) % N;
  let nextY = y + (x + 1 === N ? 1 : 0);

  for (let t of tiles) {
    if (isValid(grid, x, y, t)) {
      grid[y][x] = t;

      if (solveBacktracking(grid, nextX, nextY)) return true;
    }
  }

  grid[y][x] = null;
  return false;
}

// ============================================================
// 5. WFC Propagation / Collapse Demo
// ============================================================

function wfcSolve() {
  const dirs = [
    [1, 0],
    [-1, 0],
    [0, 1],
    [0, -1]
  ];

  let domains = Array.from({ length: N }, () =>
    Array.from({ length: N }, () => new Set(tiles))
  );

  function collapse(x, y, tile) {
    domains[y][x] = new Set([tile]);
    propagate([{ x, y }]);
  }

  function propagate(queue) {
    while (queue.length) {
      const { x, y } = queue.shift();

      if (!domains[y][x].has("A")) continue;

      for (const [dx, dy] of dirs) {
        const nx = x + dx;
        const ny = y + dy;

        if (nx < 0 || nx >= N || ny < 0 || ny >= N) continue;

        if (
          domains[y][x].size === 1 &&
          domains[y][x].has("A") &&
          domains[ny][nx].has("A")
        ) {
          domains[ny][nx].delete("A");
          queue.push({ x: nx, y: ny });
        }
      }
    }
  }

  while (true) {
    let best = null;
    let bestEntropy = Infinity;

    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const entropy = domains[y][x].size;

        if (entropy > 1 && entropy < bestEntropy) {
          best = { x, y };
          bestEntropy = entropy;
        }
      }
    }

    if (!best) break;

    console.log("Lowest-entropy choice:", {
      x: best.x,
      y: best.y,
      entropy: bestEntropy,
      domain: [...domains[best.y][best.x]]
    });

    const tile = weightedRandomChoice(
      [...domains[best.y][best.x]],
      id => overlapPatternWeightsById.get(id) || 1
    );
    collapse(best.x, best.y, tile);
  }

  return domains.map(row => row.map(cell => [...cell][0]));
}

// ============================================================
// 6. WFC Spec -> CNF / DIMACS Compiler
// ============================================================

function wfcToCnf(spec) {
  const { width, height, allowed } = spec;
  const tiles = spec.tiles.map(t => t.name);

  let nextVar = 1;
  const varMap = {};
  const nameMap = {};
  const clauses = [];

  function varFor(x, y, tile) {
    const key = `${x},${y},${tile}`;

    if (!varMap[key]) {
      varMap[key] = nextVar;
      nameMap[nextVar] = key;
      nextVar++;
    }

    return varMap[key];
  }

  // Create variables
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      for (const tile of tiles) {
        varFor(x, y, tile);
      }
    }
  }

  // Exactly one tile per cell
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      clauses.push(tiles.map(tile => varFor(x, y, tile)));

      for (let i = 0; i < tiles.length; i++) {
        for (let j = i + 1; j < tiles.length; j++) {
          clauses.push([
            -varFor(x, y, tiles[i]),
            -varFor(x, y, tiles[j])
          ]);
        }
      }
    }
  }

  function addAdjacencyClauses(direction, dx, dy) {
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const nx = x + dx;
        const ny = y + dy;

        if (nx < 0 || nx >= width || ny < 0 || ny >= height) continue;

        for (const t1 of tiles) {
          for (const t2 of tiles) {
            const ok = allowed[direction][t1].includes(t2);

            if (!ok) {
              clauses.push([
                -varFor(x, y, t1),
                -varFor(nx, ny, t2)
              ]);
            }
          }
        }
      }
    }
  }

  addAdjacencyClauses("right", 1, 0);
  addAdjacencyClauses("down", 0, 1);

  const numVars = nextVar - 1;

  const dimacs =
    `p cnf ${numVars} ${clauses.length}\n` +
    clauses.map(c => c.join(" ") + " 0").join("\n");

  return {
    clauses,
    varMap,
    nameMap,
    dimacs,
    numVars
  };
}

// ============================================================
// 7. SAT Assignment Decoding
// ============================================================

// This simulates a SAT solver assignment from an existing solved grid.
// Later, this can be replaced with a real SAT solver result.
function gridToSatAssignment(grid, cnf) {
  const assignment = {};

  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      for (const tile of tiles) {
        const key = `${x},${y},${tile}`;
        const v = cnf.varMap[key];

        assignment[v] = grid[y][x] === tile;
      }
    }
  }

  return assignment;
}

function decodeSatAssignment(assignment, cnf, spec) {
  const grid = makeEmptyGrid(spec.width, spec.height);

  for (const [varId, isTrue] of Object.entries(assignment)) {
    if (!isTrue) continue;

    const name = cnf.nameMap[varId];
    if (!name) continue;

    const [xStr, yStr, tile] = name.split(",");
    const x = Number(xStr);
    const y = Number(yStr);

    grid[y][x] = tile;
  }

  return grid;
}

// ============================================================
// 8. Run Demo
// ============================================================

const cnf = wfcToCnf(spec);

const greedyGrid = greedy();

const wfcGrid = wfcSolve();

const backtrackingGrid = makeEmptyGrid(N, N);
solveBacktracking(backtrackingGrid);
