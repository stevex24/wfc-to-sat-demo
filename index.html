
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WFC to SAT Demo</title>
</head>

<body>
<pre id="output"></pre>

<script>
// Grid size
const N = 5;

// Tiles
const tiles = ["A", "B"];

// Rule: A cannot touch A
function isValid(grid, x, y, tile) {
  // check left
  if (x > 0 && grid[y][x-1] === "A" && tile === "A") return false;

  // check up
  if (y > 0 && grid[y-1][x] === "A" && tile === "A") return false;

  return true;
}

// SAT-style solver (backtracking)
function solve(grid, x = 0, y = 0) {
  if (y === N) return true;

  let nextX = (x + 1) % N;
  let nextY = y + (x + 1 === N ? 1 : 0);

  for (let t of tiles) {
    if (isValid(grid, x, y, t)) {
      grid[y][x] = t;

      if (solve(grid, nextX, nextY)) return true;
    }
  }

  grid[y][x] = null;
  return false;
}

// Greedy generator
function greedy() {
  let grid = Array.from({length: N}, () => Array(N).fill(null));

  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {

      let choice = Math.random() < 0.5 ? "A" : "B";

      if (!isValid(grid, x, y, choice)) {
        choice = "B";
      }

      grid[y][x] = choice;
    }
  }

  return grid;
}

// True WFC propagation/collapse demo
function wfcSolve() {

  const dirs = [
    [1,0],
    [-1,0],
    [0,1],
    [0,-1]
  ];

  // Each cell starts with domain {A,B}
  let domains = Array.from({length: N}, () =>
    Array.from({length: N}, () => new Set(["A", "B"]))
  );

  function collapse(x, y, tile) {
    domains[y][x] = new Set([tile]);
    propagate([{x, y}]);
  }

  function propagate(queue) {

    while (queue.length) {

      const {x, y} = queue.shift();

      // Only propagate if this cell can be A
      if (!domains[y][x].has("A")) continue;

      for (const [dx, dy] of dirs) {

        const nx = x + dx;
        const ny = y + dy;

        if (nx < 0 || nx >= N || ny < 0 || ny >= N) {
          continue;
        }

        // If current cell is definitely A,
        // neighbors cannot be A
        if (
          domains[y][x].size === 1 &&
          domains[y][x].has("A") &&
          domains[ny][nx].has("A")
        ) {

          domains[ny][nx].delete("A");

          queue.push({x: nx, y: ny});
        }
      }
    }
  }

  while (true) {

    let best = null;

    // Pick an unresolved cell
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {

        if (domains[y][x].size > 1) {
          best = {x, y};
        }
      }
    }

    if (!best) break;

    // Collapse randomly
    const tile = Math.random() < 0.5 ? "A" : "B";

    collapse(best.x, best.y, tile);
  }

  // Convert domains to final grid
  return domains.map(row =>
    row.map(cell => [...cell][0])
  );
}

// Simple tiled WFC -> CNF encoder

const spec = {
  width: 5,
  height: 5,
  tiles: ["A", "B"],
  allowed: {
    right: {
      A: ["B"],       // A cannot be right-next-to A
      B: ["A", "B"]
    },
    down: {
      A: ["B"],       // A cannot be down-next-to A
      B: ["A", "B"]
    }
  }
};

function wfcToCnf(spec) {
  const { width, height, tiles, allowed } = spec;

  let nextVar = 1;
  const varMap = {};
  const nameMap = {};
  const clauses = [];

  function varFor(x, y, tile) {
    const key = `${x},${y},${tile}`;
    if (!varMap[key]) {
      varMap[key] = nextVar;
      nameMap[nextVar] = key;
      nextVar++;
    }
    return varMap[key];
  }

  // Create all variables
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      for (const tile of tiles) {
        varFor(x, y, tile);
      }
    }
  }

  // Exactly one tile per cell
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      // at least one
      clauses.push(tiles.map(tile => varFor(x, y, tile)));

      // at most one
      for (let i = 0; i < tiles.length; i++) {
        for (let j = i + 1; j < tiles.length; j++) {
          clauses.push([
            -varFor(x, y, tiles[i]),
            -varFor(x, y, tiles[j])
          ]);
        }
      }
    }
  }

  // Adjacency constraints
  function addAdjacencyClauses(direction, dx, dy) {
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const nx = x + dx;
        const ny = y + dy;

        if (nx < 0 || nx >= width || ny < 0 || ny >= height) continue;

        for (const t1 of tiles) {
          for (const t2 of tiles) {
            const ok = allowed[direction][t1].includes(t2);

            if (!ok) {
              clauses.push([
                -varFor(x, y, t1),
                -varFor(nx, ny, t2)
              ]);
            }
          }
        }
      }
    }
  }

  addAdjacencyClauses("right", 1, 0);
  addAdjacencyClauses("down", 0, 1);

  const numVars = nextVar - 1;

  const dimacs =
    `p cnf ${numVars} ${clauses.length}\n` +
    clauses.map(c => c.join(" ") + " 0").join("\n");

  return { clauses, varMap, nameMap, dimacs };
}

const result = wfcToCnf(spec);

console.log("Clauses:", result.clauses);
console.log("DIMACS:\n" + result.dimacs);

// Pretty print
function printGrid(grid) {
  return grid.map(row => row.join(" ")).join("\n");
}

// Run demos
let greedyGrid = greedy();

let wfcGrid = wfcSolve();

let satGrid = Array.from({length: N}, () => Array(N).fill(null));

solve(satGrid);

// Output
document.getElementById("output").textContent =

  "WFC / Wang Tile Demo\n\n" +

  "Rule:\nA cannot touch A horizontally or vertically\n\n" +

  "Greedy solution:\n\n" +
  printGrid(greedyGrid) +

  "\n\nWFC propagation/collapse solution:\n\n" +
  printGrid(wfcGrid) +

  "\n\nSAT-style solution:\n\n" +
  printGrid(satGrid) +

  "\n\nCNF Summary:\n" +
  `Variables: ${Object.keys(result.nameMap).length}\n` +
  `Clauses: ${result.clauses.length}\n\n` +

  "DIMACS CNF:\n\n" +
  result.dimacs;

</script>

</body>
</html>
