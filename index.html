
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WFC to SAT Demo</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  padding: 20px;
}

.grid-container {
  display: flex;
  gap: 30px;
  flex-wrap: wrap;
}

.panel {
  background: #222;
  padding: 15px;
  border-radius: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 40px);
  gap: 2px;
}

.cell {
  width: 40px;
  height: 40px;
  border-radius: 4px;
}

.tile-A {
  background: #4fc3f7;
}

.tile-B {
  background: #ffb74d;
}

pre {
  background: #222;
  padding: 10px;
  overflow-x: auto;
}
</style>

</head>

<body>

<h1>WFC → SAT Demo</h1>

<div class="grid-container">
  <div class="panel">
    <h2>Greedy</h2>
    <div id="greedyGrid"></div>
  </div>

  <div class="panel">
    <h2>WFC Propagation</h2>
    <div id="wfcGrid"></div>
  </div>

  <div class="panel">
    <h2>SAT Backtracking</h2>
    <div id="satGrid"></div>
  </div>

  <div class="panel">
    <h2>Decoded SAT Assignment</h2>
    <div id="decodedGrid"></div>
  </div>
</div>

<div class="panel summary-panel">
  <h2>Rule</h2>
  <p>A cannot touch A horizontally or vertically.</p>
  <h2>CNF Summary</h2>
  <pre id="summaryOutput"></pre>
</div>

<h2>DIMACS CNF</h2>
<pre id="dimacsOutput"></pre>


<script>
// ============================================================
// 1. Problem Spec
// ============================================================

const spec = {
  width: 5,
  height: 5,
  tiles: ["A", "B"],
  allowed: {
    right: {
      A: ["B"],
      B: ["A", "B"]
    },
    down: {
      A: ["B"],
      B: ["A", "B"]
    }
  }
};

const N = spec.width;
const tiles = spec.tiles;

// ============================================================
// 2. Shared Helpers
// ============================================================

function printGrid(grid) {
  return grid.map(row => row.join(" ")).join("\n");
}


function renderGrid(grid, elementId) {
  const container = document.getElementById(elementId);

  container.className = "grid";
  container.innerHTML = "";

  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      const tile = grid[y][x];
      const cell = document.createElement("div");

      cell.className = `cell tile-${tile}`;

      container.appendChild(cell);
    }
  }
}


function makeEmptyGrid(width, height) {
  return Array.from({ length: height }, () => Array(width).fill(null));
}

// Rule: A cannot touch A, checked only left/up for generation
function isValid(grid, x, y, tile) {
  if (x > 0 && grid[y][x - 1] === "A" && tile === "A") return false;
  if (y > 0 && grid[y - 1][x] === "A" && tile === "A") return false;
  return true;
}

// ============================================================
// 3. Greedy Generator
// ============================================================

function greedy() {
  let grid = makeEmptyGrid(N, N);

  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      let choice = Math.random() < 0.5 ? "A" : "B";

      if (!isValid(grid, x, y, choice)) {
        choice = "B";
      }

      grid[y][x] = choice;
    }
  }

  return grid;
}

// ============================================================
// 4. SAT-Style Backtracking Solver
// ============================================================

function solveBacktracking(grid, x = 0, y = 0) {
  if (y === N) return true;

  let nextX = (x + 1) % N;
  let nextY = y + (x + 1 === N ? 1 : 0);

  for (let t of tiles) {
    if (isValid(grid, x, y, t)) {
      grid[y][x] = t;

      if (solveBacktracking(grid, nextX, nextY)) return true;
    }
  }

  grid[y][x] = null;
  return false;
}

// ============================================================
// 5. WFC Propagation / Collapse Demo
// ============================================================

function wfcSolve() {
  const dirs = [
    [1, 0],
    [-1, 0],
    [0, 1],
    [0, -1]
  ];

  let domains = Array.from({ length: N }, () =>
    Array.from({ length: N }, () => new Set(["A", "B"]))
  );

  function collapse(x, y, tile) {
    domains[y][x] = new Set([tile]);
    propagate([{ x, y }]);
  }

  function propagate(queue) {
    while (queue.length) {
      const { x, y } = queue.shift();

      if (!domains[y][x].has("A")) continue;

      for (const [dx, dy] of dirs) {
        const nx = x + dx;
        const ny = y + dy;

        if (nx < 0 || nx >= N || ny < 0 || ny >= N) continue;

        if (
          domains[y][x].size === 1 &&
          domains[y][x].has("A") &&
          domains[ny][nx].has("A")
        ) {
          domains[ny][nx].delete("A");
          queue.push({ x: nx, y: ny });
        }
      }
    }
  }

  while (true) {
    let best = null;

    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (domains[y][x].size > 1) {
          best = { x, y };
        }
      }
    }

    if (!best) break;

    const tile = Math.random() < 0.5 ? "A" : "B";
    collapse(best.x, best.y, tile);
  }

  return domains.map(row => row.map(cell => [...cell][0]));
}

// ============================================================
// 6. WFC Spec -> CNF / DIMACS Compiler
// ============================================================

function wfcToCnf(spec) {
  const { width, height, tiles, allowed } = spec;

  let nextVar = 1;
  const varMap = {};
  const nameMap = {};
  const clauses = [];

  function varFor(x, y, tile) {
    const key = `${x},${y},${tile}`;

    if (!varMap[key]) {
      varMap[key] = nextVar;
      nameMap[nextVar] = key;
      nextVar++;
    }

    return varMap[key];
  }

  // Create variables
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      for (const tile of tiles) {
        varFor(x, y, tile);
      }
    }
  }

  // Exactly one tile per cell
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      clauses.push(tiles.map(tile => varFor(x, y, tile)));

      for (let i = 0; i < tiles.length; i++) {
        for (let j = i + 1; j < tiles.length; j++) {
          clauses.push([
            -varFor(x, y, tiles[i]),
            -varFor(x, y, tiles[j])
          ]);
        }
      }
    }
  }

  function addAdjacencyClauses(direction, dx, dy) {
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const nx = x + dx;
        const ny = y + dy;

        if (nx < 0 || nx >= width || ny < 0 || ny >= height) continue;

        for (const t1 of tiles) {
          for (const t2 of tiles) {
            const ok = allowed[direction][t1].includes(t2);

            if (!ok) {
              clauses.push([
                -varFor(x, y, t1),
                -varFor(nx, ny, t2)
              ]);
            }
          }
        }
      }
    }
  }

  addAdjacencyClauses("right", 1, 0);
  addAdjacencyClauses("down", 0, 1);

  const numVars = nextVar - 1;

  const dimacs =
    `p cnf ${numVars} ${clauses.length}\n` +
    clauses.map(c => c.join(" ") + " 0").join("\n");

  return {
    clauses,
    varMap,
    nameMap,
    dimacs,
    numVars
  };
}

// ============================================================
// 7. SAT Assignment Decoding
// ============================================================

// This simulates a SAT solver assignment from an existing solved grid.
// Later, this can be replaced with a real SAT solver result.
function gridToSatAssignment(grid, cnf) {
  const assignment = {};

  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      for (const tile of tiles) {
        const key = `${x},${y},${tile}`;
        const v = cnf.varMap[key];

        assignment[v] = grid[y][x] === tile;
      }
    }
  }

  return assignment;
}

function decodeSatAssignment(assignment, cnf, spec) {
  const grid = makeEmptyGrid(spec.width, spec.height);

  for (const [varId, isTrue] of Object.entries(assignment)) {
    if (!isTrue) continue;

    const name = cnf.nameMap[varId];
    if (!name) continue;

    const [xStr, yStr, tile] = name.split(",");
    const x = Number(xStr);
    const y = Number(yStr);

    grid[y][x] = tile;
  }

  return grid;
}

// ============================================================
// 8. Run Demo
// ============================================================

const cnf = wfcToCnf(spec);

const greedyGrid = greedy();

const wfcGrid = wfcSolve();

const backtrackingGrid = makeEmptyGrid(N, N);
solveBacktracking(backtrackingGrid);

// For now, simulate SAT output from the backtracking solution.
const fakeSatAssignment = gridToSatAssignment(backtrackingGrid, cnf);
const decodedSatGrid = decodeSatAssignment(fakeSatAssignment, cnf, spec);

console.log("Clauses:", cnf.clauses);
console.log("DIMACS:\n" + cnf.dimacs);
console.log("Decoded SAT grid:", decodedSatGrid);

// ============================================================
// 9. Output
// ============================================================


renderGrid(greedyGrid, "greedyGrid");
renderGrid(wfcGrid, "wfcGrid");
renderGrid(backtrackingGrid, "satGrid");
renderGrid(decodedSatGrid, "decodedGrid");

document.getElementById("summaryOutput").textContent =
  `Variables: ${cnf.numVars}\nClauses: ${cnf.clauses.length}`;

document.getElementById("dimacsOutput").textContent =
  cnf.dimacs;

</script>

</body>
</html>
